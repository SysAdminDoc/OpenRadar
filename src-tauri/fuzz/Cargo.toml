[package]
name = "openradar-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
# The bundle target has to build the checksum the reader checks before it
# parses, or every input stops at the door. Pinned to what the app itself
# uses so the two agree about what a SHA-256 is.
sha2 = "0.10.9"

[dependencies.openradar]
path = ".."
features = ["fuzzing"]

# The targets are what they are worth being: they parse bytes from a public
# service and they must not panic or allocate without bound on any of them.
[[bin]]
name = "pmtiles_archive"
path = "fuzz_targets/pmtiles_archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "level2_volume"
path = "fuzz_targets/level2_volume.rs"
test = false
doc = false
bench = false

[[bin]]
name = "grib_message"
path = "fuzz_targets/grib_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "grib_complex"
path = "fuzz_targets/grib_complex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mrms_grib"
path = "fuzz_targets/mrms_grib.rs"
test = false
doc = false
bench = false

[[bin]]
name = "level3_message"
path = "fuzz_targets/level3_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "netcdf_flashes"
path = "fuzz_targets/netcdf_flashes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "orb_bundle"
path = "fuzz_targets/orb_bundle.rs"
test = false
doc = false
bench = false
