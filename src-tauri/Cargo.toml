[package]
name = "openradar"
version = "0.6.0"
description = "OpenRadar v0.6.0 desktop weather radar"
authors = ["SysAdminDoc <matt_parker@outlook.com>"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "openradar_lib"
# An rlib and nothing else. The Tauri template declares a staticlib and a
# cdylib beside it for iOS and Android, which this app does not target: it is
# a Windows desktop binary and `main.rs` links the rlib. Keeping the other two
# cost a pointless link step on every build, and broke the fuzz targets
# outright, because rustc emits every declared crate type in one invocation
# and libfuzzer's runtime leaves a cdylib with no `main` to link against.
crate-type = ["rlib"]

[features]
# Exposes the decoder entry points through lib.rs so the fuzz workspace can
# reach them. Nothing but src-tauri/fuzz turns this on, and the shipped build
# exports what it always did.
fuzzing = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
thiserror = "2.0.20"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "charset"] }
tauri-plugin-notification = "2.3.3"
# The aws feature is on for the chunk types and the volume assembler, not for
# its networking: every request in this app goes through src/http.rs so there
# is one allowlist and one User-Agent. reqwest is already in the tree.
#
# All three are release candidates and all three are pinned exactly, because a
# pre-release may change what it decodes without changing what it is called.
# `level2::tests::golden` writes down the geometry, the units and the cuts a
# known volume comes out as, so an update that moves any of them fails rather
# than quietly redrawing the map, and `level2::tests::malformed` sweeps every
# corrupt and truncated byte of a volume through the parser.
#
# Upstream: https://github.com/danielway/nexrad (active; last release 2026-07,
# no open issues at the 2026-08-31 review). Two things to pick up when they
# ship:
#   - `decode_angle` in the VCP decoder reads a negative elevation as roughly
#     360 degrees (issue 144, fixed on main 2026-07-21). OpenRadar is not
#     affected today because cut matching uses median radial angles, and a
#     negative-elevation fixture goes in with the upgrade.
#   - `File::records` slices past the Archive II header without checking the
#     file is that long, so a file under 24 bytes panics. Guarded here in
#     `level2::normalized_volume`; the guard can go when upstream returns an
#     error instead.
#
# Review by 2027-03-01, or whenever a 1.0.0 lands.
nexrad-data = { version = "=1.0.0-rc.7", default-features = false, features = ["nexrad-model", "aws"] }
nexrad-decode = "=1.0.0-rc.3"
nexrad-model = { version = "=1.0.0-rc.2", features = ["chrono"] }
png = "0.18.1"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.10"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
netcdf-reader = { version = "0.9.1", default-features = false, features = ["netcdf4"] }
tokio = { version = "1.53.1", features = ["macros", "sync", "time"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-dialog = "2.7.3"
bytes = "1.10.1"
futures-util = "0.3.31"
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png"] }
pmtiles = { version = "=0.16.0", default-features = false, features = ["mmap-async-tokio", "write"] }
sha2 = "0.10.9"
# The digital Level III products (the hydrometeor classification and its
# hybrid) carry a bzip2 symbology block, where the graphic products this
# decoder already read are small and plain. Already in the graph as a
# transitive dependency of nexrad-data, and pinned to the version it pulls.
bzip2 = "0.6.0"

[dev-dependencies]
# Shapes bytes into typed values for the property test over complex packing,
# which is the stable-toolchain half of what the fuzz targets do on nightly.
arbitrary = { version = "1", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
