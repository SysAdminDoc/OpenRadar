[package]
name = "openradar"
version = "0.1.0"
description = "OpenRadar v0.1.0 desktop weather radar"
authors = ["SysAdminDoc <matt_parker@outlook.com>"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "openradar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
thiserror = "2.0.20"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "charset"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }

