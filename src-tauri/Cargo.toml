[package]
name = "openradar"
version = "0.5.0"
description = "OpenRadar v0.5.0 desktop weather radar"
authors = ["SysAdminDoc <matt_parker@outlook.com>"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "openradar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
thiserror = "2.0.20"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "charset"] }
tauri-plugin-notification = "2.3.3"
# The aws feature is on for the chunk types and the volume assembler, not for
# its networking: every request in this app goes through src/http.rs so there
# is one allowlist and one User-Agent. reqwest is already in the tree.
nexrad-data = { version = "=1.0.0-rc.7", default-features = false, features = ["nexrad-model", "aws"] }
nexrad-decode = "=1.0.0-rc.3"
nexrad-model = { version = "=1.0.0-rc.2", features = ["chrono"] }
png = "0.18.1"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.10"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
netcdf-reader = { version = "0.9.1", default-features = false, features = ["netcdf4"] }
tokio = { version = "1.53.1", features = ["macros", "sync", "time"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-dialog = "2.7.3"
bytes = "1.10.1"
futures-util = "0.3.31"
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png"] }
pmtiles = { version = "=0.16.0", default-features = false, features = ["mmap-async-tokio", "write"] }
sha2 = "0.10.9"

[dev-dependencies]
# Level II records are bzip2 inside, so writing a test volume needs an encoder.
# The version is the one nexrad-data already pulls in.
bzip2 = "0.6.0"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
