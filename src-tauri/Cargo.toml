[package]
name = "openradar"
version = "0.1.0"
description = "OpenRadar v0.1.0 desktop weather radar"
authors = ["SysAdminDoc <matt_parker@outlook.com>"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "openradar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
thiserror = "2.0.20"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "charset"] }
tauri-plugin-notification = "2.3.3"
nexrad-data = { version = "=1.0.0-rc.7", default-features = false, features = ["nexrad-model"] }
nexrad-decode = "=1.0.0-rc.3"
nexrad-model = { version = "=1.0.0-rc.2", features = ["chrono"] }
png = "0.18.1"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.10"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
netcdf-reader = { version = "0.9.1", default-features = false, features = ["netcdf4"] }
tokio = { version = "1.53.1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }

